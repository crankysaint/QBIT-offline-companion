[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DQBIT_BUTTON_PIN=1
    -DQBIT_BUTTON_ACTIVE_LOW=1
    -DQBIT_I2C_SDA_PIN=20
    -DQBIT_I2C_SCL_PIN=21
    -DQBIT_I2C_ADDRESS=0x3D
lib_deps =
    adafruit/Adafruit BusIO@^1.17.4
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1327@^1.0.4
    https://github.com/FluxGarage/RoboEyes.git#v1.1.2
